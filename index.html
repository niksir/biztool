<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizTool - Προσφορές & Αποδείξεις</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <style>
        /* CSS ΓΙΑ ΤΗΝ ΕΚΤΥΠΩΣΗ / ΑΠΟΘΗΚΕΥΣΗ ΣΕ PDF */
        @media print {
            /* Κρύβουμε τα πάντα στην οθόνη (φόρμες, κουμπιά, modal) */
            body * {
                visibility: hidden;
            }
            /* Εμφανίζουμε ΜΟΝΟ το template του PDF */
            #printTemplate, #printTemplate * {
                visibility: visible;
            }
            /* Τοποθετούμε το template στην κορυφή της σελίδας εκτύπωσης */
            #printTemplate {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                display: block !important;
            }
            /* Αφαιρούμε background elements που δεν χρειάζονται */
            body {
                background-color: white;
            }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased pb-12">

    <div id="mainApp" class="max-w-md mx-auto px-4 pt-6">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-indigo-600">BizTool 🛠️</h1>
            <button onclick="toggleSetup()" class="text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-1 px-3 rounded-lg transition cursor-pointer">
                ⚙️ Ρυθμίσεις
            </button>
        </header>

        <div id="setupSection" class="hidden bg-white p-5 rounded-2xl shadow-sm border border-gray-100 mb-6">
            <h2 class="text-lg font-semibold mb-4 text-gray-900 border-b pb-2">Στοιχεία Επαγγελματία</h2>
            <div class="space-y-3 mb-4">
                <input type="text" id="bizName" placeholder="Όνομα / Επωνυμία Επιχείρησης" class="w-full p-2.5 border rounded-lg text-sm outline-none">
                <input type="text" id="bizPhone" placeholder="Τηλέφωνο Επικοινωνίας" class="w-full p-2.5 border rounded-lg text-sm outline-none">
            </div>

            <h2 class="text-md font-semibold mb-2 text-gray-900">Οι Υπηρεσίες & Τιμές μου</h2>
            <div id="servicesSetupList" class="space-y-2 mb-3"></div>
            <button onclick="addServiceField('', '')" class="w-full bg-gray-100 text-indigo-600 text-xs font-semibold py-2 rounded-lg border border-dashed border-indigo-300 mb-4 cursor-pointer">
                + Προσθήκη Νέας Υπηρεσίας
            </button>

            <button onclick="saveSetup()" class="w-full bg-indigo-600 text-white font-medium py-2.5 rounded-lg text-sm shadow-sm cursor-pointer">
                Αποθήκευση Αλλαγών
            </button>
        </div>

        <main class="space-y-6">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-md font-semibold mb-3 text-gray-900">Στοιχεία Πελάτη</h2>
                <div class="space-y-3">
                    <input type="text" id="clientName" placeholder="Όνομα Πελάτη" class="w-full p-2.5 border rounded-lg text-sm outline-none">
                    <input type="text" id="clientPhone" placeholder="Κινητό (για WhatsApp / Viber)" class="w-full p-2.5 border rounded-lg text-sm outline-none">
                    <input type="email" id="clientEmail" placeholder="Email Πελάτη - Προαιρετικό" class="w-full p-2.5 border rounded-lg text-sm outline-none">
                    
                    <div class="flex gap-4 pt-1">
                        <label class="flex items-center text-sm font-medium text-gray-700 cursor-pointer">
                            <input type="radio" name="docType" value="Προσφορά" checked class="mr-2 text-indigo-600"> Προσφορά
                        </label>
                        <label class="flex items-center text-sm font-medium text-gray-700 cursor-pointer">
                            <input type="radio" name="docType" value="Απόδειξη" class="mr-2 text-indigo-600"> Απόδειξη
                        </label>
                    </div>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-md font-semibold mb-3 text-gray-900">Επιλογή Εργασιών</h2>
                <div id="servicesSelectionList" class="space-y-3"></div>
            </div>

            <button onclick="processDocument()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-md text-base cursor-pointer">
                🚀 Δημιουργία Έκδοσης
            </button>
        </main>
    </div>

    <div id="successModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-xl space-y-4">
            <div class="text-center">
                <div class="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-2 text-xl">✓</div>
                <h3 class="text-lg font-bold text-gray-900">Το έγγραφο δημιουργήθηκε!</h3>
                <p class="text-xs text-gray-500">Επιλέξτε πώς θέλετε να το διακινήσετε.</p>
            </div>
            
            <div class="space-y-2 pt-2">
                <button onclick="triggerPrint()" class="w-full bg-gray-800 text-white font-medium py-2.5 rounded-lg text-sm flex justify-center items-center gap-2 cursor-pointer">
                    📥 Κατέβασμα PDF / Εκτύπωση
                </button>
                <button id="modalWaBtn" onclick="sendWhatsApp()" class="w-full bg-emerald-600 text-white font-medium py-2.5 rounded-lg text-sm flex justify-center items-center gap-2 cursor-pointer">
                    💬 Αποστολή μέσω WhatsApp
                </button>
                <button id="modalViberBtn" onclick="sendViber()" class="w-full bg-purple-600 text-white font-medium py-2.5 rounded-lg text-sm flex justify-center items-center gap-2 cursor-pointer">
                    💜 Αποστολή μέσω Viber
                </button>
                <button id="modalEmailBtn" onclick="sendMailClient()" class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-lg text-sm flex justify-center items-center gap-2 cursor-pointer">
                    ✉️ Αποστολή στο Email πελάτη
                </button>
            </div>

            <button onclick="closeModal()" class="w-full text-center text-xs text-gray-400 hover:text-gray-600 pt-2 block cursor-pointer">
                « Επιστροφή στην αρχική
            </button>
        </div>
    </div>

    <div id="printTemplate" class="hidden p-8 bg-white text-black max-w-2xl mx-auto">
        <div class="flex justify-between border-b-2 border-indigo-600 pb-4 mb-6">
            <div>
                <h1 id="pdfBizName" class="text-2xl font-bold text-indigo-600 m-0"></h1>
                <p id="pdfBizPhone" class="mt-1 text-sm text-gray-600 m-0"></p>
            </div>
            <div class="text-right">
                <h2 id="pdfDocType" class="text-xl font-bold uppercase m-0 text-gray-800"></h2>
                <p class="mt-1 text-xs text-gray-500 m-0">Ημερομηνία: <span id="pdfDate"></span></p>
            </div>
        </div>
        <div class="my-6">
            <strong class="text-xs uppercase text-gray-500 block tracking-wider">Προς τον Πελάτη:</strong>
            <p id="pdfClientName" class="text-lg font-bold text-gray-900 mt-1 m-0"></p>
        </div>
        <table class="w-full border-collapse mt-6 text-sm">
            <thead>
                <tr class="bg-gray-50 text-left">
                    <th class="p-3 border-b border-gray-200 text-gray-700 font-bold">Περιγραφή Εργασίας</th>
                    <th class="p-3 border-b border-gray-200 text-center w-16 text-gray-700 font-bold">Ποσ.</th>
                    <th class="p-3 border-b border-gray-200 text-right w-24 text-gray-700 font-bold">Τιμή</th>
                </tr>
            </thead>
            <tbody id="pdfTableBody"></tbody>
        </table>
        <div class="text-right mt-8 text-lg font-bold border-top-2 border-gray-800 pt-4 text-gray-900">
            Γενικό Σύνολο: <span id="pdfTotal" class="text-indigo-600"></span>
        </div>
    </div>

    <script>
        let myBusiness = JSON.parse(localStorage.getItem('myBusiness')) || { name: '', phone: '' };
        let myServices = JSON.parse(localStorage.getItem('myServices')) || [];
        let currentDocumentData = null;

        window.onload = function() {
            document.getElementById('bizName').value = myBusiness.name;
            document.getElementById('bizPhone').value = myBusiness.phone;
            if(myServices.length === 0) {
                myServices = [{name: "Εργασία / Ώρα", price: "25"}, {name: "Βασική Επίσκεψη", price: "35"}];
            }
            renderSetupServices();
            renderSelectionServices();
        };

        function toggleSetup() { document.getElementById('setupSection').classList.toggle('hidden'); }

        function renderSetupServices() {
            const list = document.getElementById('servicesSetupList');
            list.innerHTML = '';
            myServices.forEach(service => addServiceField(service.name, service.price));
        }

        function addServiceField(name, price) {
            const list = document.getElementById('servicesSetupList');
            const div = document.createElement('div');
            div.className = 'flex gap-2 items-center service-row';
            div.innerHTML = `
                <input type="text" placeholder="Υπηρεσία" value="${name}" class="flex-1 p-2 border rounded-lg text-xs outline-none s-name">
                <input type="number" placeholder="€" value="${price}" class="w-20 p-2 border rounded-lg text-xs outline-none s-price">
                <button onclick="this.parentElement.remove()" class="text-red-500 text-sm px-1">✕</button>
            `;
            list.appendChild(div);
        }

        function saveSetup() {
            myBusiness.name = document.getElementById('bizName').value;
            myBusiness.phone = document.getElementById('bizPhone').value;
            const rows = document.querySelectorAll('.service-row');
            myServices = [];
            rows.forEach(row => {
                const name = row.querySelector('.s-name').value;
                const price = row.querySelector('.s-price').value;
                if(name && price) myServices.push({name, price});
            });
            localStorage.setItem('myBusiness', JSON.stringify(myBusiness));
            localStorage.setItem('myServices', JSON.stringify(myServices));
            renderSelectionServices();
            toggleSetup();
            alert('Οι ρυθμίσεις αποθηκεύτηκαν!');
        }

        function renderSelectionServices() {
            const list = document.getElementById('servicesSelectionList');
            list.innerHTML = '';
            if(myServices.length === 0) {
                list.innerHTML = '<p class="text-xs text-gray-400 italic">Πατήστε τις Ρυθμίσεις για προσθήκη υπηρεσιών.</p>';
                return;
            }
            myServices.forEach((service, index) => {
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between p-2.5 bg-gray-50 rounded-xl border border-gray-200';
                div.innerHTML = `
                    <label class="flex items-center space-x-3 cursor-pointer text-sm font-medium text-gray-700 flex-1">
                        <input type="checkbox" value="${index}" class="service-checkbox w-4 h-4 text-indigo-600 mr-2">
                        <span>${service.name} <span class="text-gray-400 font-normal">(${service.price}€)</span></span>
                    </label>
                    <div class="flex items-center gap-1">
                        <input type="number" value="1" min="1" class="service-qty w-12 p-1 text-center border rounded-lg text-xs outline-none">
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function processDocument() {
            const clientName = document.getElementById('clientName').value;
            const clientPhone = document.getElementById('clientPhone').value;
            const clientEmail = document.getElementById('clientEmail').value;
            const docType = document.querySelector('input[name="docType"]:checked').value;

            if(!clientName) {
                alert('Παρακαλώ βάλτε το όνομα του πελάτη.');
                return;
            }

            const checkboxes = document.querySelectorAll('.service-checkbox');
            const qtys = document.querySelectorAll('.service-qty');
            let items = [];
            let total = 0;

            checkboxes.forEach((cb, i) => {
                if(cb.checked) {
                    const service = myServices[cb.value];
                    const qty = parseInt(qtys[i].value) || 1;
                    const lineTotal = parseFloat(service.price) * qty;
                    items.push({ name: service.name, qty: qty, price: service.price, total: lineTotal });
                    total += lineTotal;
                }
            });

            if(items.length === 0) {
                alert('Επιλέξτε τουλάχιστον μία εργασία.');
                return;
            }

            currentDocumentData = { clientName, clientPhone, clientEmail, docType, items, total };

            document.getElementById('modalWaBtn').style.display = clientPhone ? 'block' : 'none';
            document.getElementById('modalViberBtn').style.display = clientPhone ? 'block' : 'none';
            document.getElementById('modalEmailBtn').style.display = clientEmail ? 'block' : 'none';

            // Προετοιμασία των στοιχείων εκτύπωσης από τώρα
            document.getElementById('pdfBizName').innerText = myBusiness.name || 'Επαγγελματίας';
            document.getElementById('pdfBizPhone').innerText = myBusiness.phone ? 'Τηλ: ' + myBusiness.phone : '';
            document.getElementById('pdfDocType').innerText = docType;
            document.getElementById('pdfDate').innerText = new Date().toLocaleDateString('el-GR');
            document.getElementById('pdfClientName').innerText = clientName;

            const tbody = document.getElementById('pdfTableBody');
            tbody.innerHTML = '';
            items.forEach(item => {
                tbody.innerHTML += `
                    <tr class="border-b border-gray-100">
                        <td class="p-3 text-gray-800">${item.name}</td>
                        <td class="p-3 text-center text-gray-600">${item.qty}</td>
                        <td class="p-3 text-right text-gray-800 font-medium">${item.total}€</td>
                    </tr>
                `;
            });
            document.getElementById('pdfTotal').innerText = total + '€';

            document.getElementById('successModal').classList.remove('hidden');
        }

        // Η ΝΕΑ ΕΞΥΠΝΗ ΛΕΙΤΟΥΡΓΙΑ ΓΙΑ ΚΑΤΕΒΑΣΜΑ PDF
        function triggerPrint() {
            // Εμφανίζουμε προσωρινά το template για να το προλάβει ο browser
            const template = document.getElementById('printTemplate');
            template.classList.remove('hidden');
            
            // Ανοίγουμε το παράθυρο του συστήματος
            window.print();
            
            // Ξανακρύβουμε το template μετά την εκτύπωση
            template.classList.add('hidden');
        }

        function buildTextMessage(data) {
            let msg = `*${data.docType} από: ${myBusiness.name}*\n---------------------------\n*Προς:* ${data.clientName}\n\n`;
            data.items.forEach(item => { msg += `- ${item.name} x${item.qty}: ${item.total}€\n`; });
            msg += `\n*Σύνολο: ${data.total}€*\n---------------------------\n`;
            if(myBusiness.phone) msg += `Τηλ: ${myBusiness.phone}`;
            return msg;
        }

        function sendWhatsApp() {
            const data = currentDocumentData;
            let phone = data.clientPhone.replace(/\s+/g, '');
            if(!phone.startsWith('30') && phone.length === 10) phone = '30' + phone;
            const msg = buildTextMessage(data);
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function sendViber() {
            const data = currentDocumentData;
            let phone = data.clientPhone.replace(/\s+/g, '');
            if(!phone.startsWith('+30') && phone.length === 10) {
                phone = '+30' + phone;
            } else if(phone.startsWith('30') && !phone.startsWith('+30')) {
                phone = '+' + phone;
            }
            let msg = `${data.docType} από: ${myBusiness.name}\n---------------------------\nΠρος: ${data.clientName}\n\n`;
            data.items.forEach(item => { msg += `- ${item.name} x${item.qty}: ${item.total}€\n`; });
            msg += `\nΣύνολο: ${data.total}€\n---------------------------\n`;
            if(myBusiness.phone) msg += `Τηλ: ${myBusiness.phone}`;

            window.open(`viber://contact?number=${phone}&text=${encodeURIComponent(msg)}`, '_blank');
        }

        function sendMailClient() {
            const data = currentDocumentData;
            const subject = encodeURIComponent(`${data.docType} - ${myBusiness.name}`);
            let body = `Αγαπητέ/ή ${data.clientName},\n\nΣας στέλνουμε την ${data.docType.toLowerCase()} για τις εργασίες μας:\n\n`;
            data.items.forEach(item => { body += `- ${item.name} (Ποσότητα: ${item.qty}): ${item.total}€\n`; });
            body += `\nΣύνολο: ${data.total}€\n\nΜε εκτίμηση,\n${myBusiness.name}\n${myBusiness.phone}`;
            window.open(`mailto:${data.clientEmail}?subject=${subject}&body=${encodeURIComponent(body)}`);
        }

        function closeModal() { document.getElementById('successModal').classList.add('hidden'); }
    </script>
</body>
</html>
